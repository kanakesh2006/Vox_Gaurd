<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-Auth & Anti-Spoofing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SecureBank AI Assistant</h1>
            <a href="/dashboard" class="btn" style="background: var(--panel); border: 1px solid var(--border);" target="_blank">Fraud Desk Dashboard</a>
        </header>

        <div class="panel chat-box" id="chat">
            <div class="msg ai">Hello! I am your SecureBank AI assistant. How can I help you today?</div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                Start Call
            </button>
            <button id="stopBtn" class="btn danger" style="display: none;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
                End Call
            </button>
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const chat = document.getElementById('chat');

        let ws;
        let audioContext;
        let processor;
        let mediaStream;

        function addMessage(text, role, riskScore = null) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.textContent = text;
            if(riskScore !== null) {
                const sub = document.createElement('div');
                sub.style.fontSize = '0.75rem';
                sub.style.opacity = '0.7';
                sub.style.marginTop = '0.25rem';
                sub.textContent = `Stress Level: ${riskScore.toFixed(2)}`;
                div.appendChild(sub);
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function startCall() {
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-flex';

            ws = new WebSocket(`ws://${location.host}/call`);

            ws.onopen = async () => {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                    const source = audioContext.createMediaStreamSource(mediaStream);
                    
                    // Create script processor to capture raw PCM
                    processor = audioContext.createScriptProcessor(4096, 1, 1);
                    
                    source.connect(processor);
                    processor.connect(audioContext.destination);
                    
                    processor.onaudioprocess = (e) => {
                        if (ws.readyState === WebSocket.OPEN) {
                            const inputData = e.inputBuffer.getChannelData(0);
                            
                            // Check if speaking (simple energy check)
                            const rms = Math.sqrt(inputData.reduce((acc, val) => acc + val * val, 0) / inputData.length);
                            if (rms > 0.01) {
                                // Convert float32 to int16
                                const pcm16 = new Int16Array(inputData.length);
                                for (let i = 0; i < inputData.length; i++) {
                                    pcm16[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                                }
                                ws.send(pcm16.buffer);
                            }
                        }
                    };
                } catch (err) {
                    console.error('Error accessing microphone:', err);
                    addMessage('Error accessing microphone. Please allow permissions.', 'ai');
                    stopCall();
                }
            };

            ws.onmessage = async (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'response') {
                    if (data.transcript) addMessage(data.transcript, 'user', data.risk_score);
                    if (data.reply) addMessage(data.reply, 'ai');
                    
                    if (data.audio) {
                        const audioStr = 'data:audio/wav;base64,' + data.audio;
                        const audio = new Audio(audioStr);
                        audio.play();
                    }
                }
            };

            ws.onclose = () => {
                stopCall();
            };
        }

        function stopCall() {
            if (processor) {
                processor.disconnect();
                processor.onaudioprocess = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            if (audioContext) {
                audioContext.close();
            }
            if (ws) {
                ws.close();
            }
            startBtn.style.display = 'inline-flex';
            stopBtn.style.display = 'none';
        }

        startBtn.addEventListener('click', startCall);
        stopBtn.addEventListener('click', stopCall);
    </script>
</body>
</html>
